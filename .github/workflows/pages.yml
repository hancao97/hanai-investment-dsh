name: Publish turning-point audit to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/turning-point-capability-audit-2026-08-23.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare self-contained report
        run: |
          mkdir -p _site
          cp docs/turning-point-capability-audit-2026-08-23.html _site/index.html
          cp docs/turning-point-capability-audit-2026-08-23.html _site/turning-point-capability-audit-2026-08-23.html
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
