# Add Hanai after the existing Base and Web App bundles. Native UI stays enabled.
- id: connection
  # Preserve DSH's webStartup config dependency and expose webServer for
  # Connection's authenticated /hanai channel registration.
  inject: [webStartup, webServer]

- insert:
    - id: hanai-investment
      name: hanai-investment-dsh
      inject: [connection, webServer, sessionController, workspaceController, sessions, agentDefaultModel]
      config:
        dataRoot: !!js process.env.HANAI_INVESTMENT_DSH_HOME
        requestTimeoutMs: 12000
        reportMinChars: 800
